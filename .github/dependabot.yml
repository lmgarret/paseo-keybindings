version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # These mirror what the Paseo app and daemon ship; bump them with
      # requirements.paseo, not on their own.
      - dependency-name: "@getpaseo/plugin"
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "@types/react"
