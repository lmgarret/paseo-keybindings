name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.2.3). Leave empty to auto-detect from the commits since the last tag.'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # Anthropic Workload Identity Federation: the action exchanges this job's
      # OIDC token (sub repo:lmgarret@9049104/paseo-keybindings@1468754876:environment:release)
      # for a short-lived Anthropic token, so no API key is stored.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate AI changelog
        id: changelog
        # On tag pushes the version comes from the tag, so an LLM outage only
        # drops the AI changelog. Manual runs need next_version, so they still fail
        # unless a version is given.
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
        uses: lmgarret/llm-release-action@d83e2c706b87f8a94a53f3b6d11d8610ace338e3 # v2.2.0
        with:
          model: anthropic/claude-sonnet-5-5
          fast_model: anthropic/claude-haiku-5-5
          # Installed by Paseo users: breaking changes are behavior, the minimum
          # Paseo version, and the command and context ids that keybindings.json
          # refers to, not the internal client/server RPCs.
          project_type: app
          changelog_config: |
            default:
              languages: [en]
              tone: professional
              sections: [breaking, features, improvements, fixes]
              benefit_focused: true
              include_infrastructure: false
              summary_only: false
              emojis: true
          context_files: /README.md,/OVERVIEW.md
          context_max_tokens: 4000
          diffs: /paseo-plugin.json,/client/catalog.ts
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          NEXT_VERSION: ${{ steps.changelog.outputs.next_version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            RAW="${INPUT_VERSION:-$NEXT_VERSION}"
            VERSION="${RAW#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::No valid version resolved ('$VERSION'). The first release needs an explicit version."
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compose release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          FILES: ${{ steps.changelog.outputs.changelog_files }}
        run: |
          # The changelog is LLM output: copy it from its file, never through an expression.
          CHANGELOG_FILE=$(jq -r '.default.en // empty' <<< "${FILES:-null}")
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          {
            if [ -n "$CHANGELOG_FILE" ] && [ -s "$CHANGELOG_FILE" ]; then
              cat "$CHANGELOG_FILE"
              echo
              echo "---"
              echo
            fi
            echo "### Install"
            echo
            echo '```bash'
            echo "paseo plugin install github:${GITHUB_REPOSITORY} --ref ${TAG}"
            echo '```'
            echo
            echo "<details><summary>Full commit log</summary>"
            echo
            echo '```'
            git log --oneline "${PREVIOUS_TAG}..HEAD"
            echo '```'
            echo "</details>"
          } > "$RUNNER_TEMP/notes.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # On manual runs the tag does not exist yet: gh creates it at this commit.
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
